version: "3.8"

services:
  discord-bot:
    build: .
    container_name: github-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    # Aangezien dit project Podman als standaard gebruikt, 
    # werkt dit bestand feilloos met `podman-compose up -d` 
    # (of docker-compose up -d met API compatibiliteit).
